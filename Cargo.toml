[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "A blazing-fast native markdown reader for macOS, built with GPUI"

[dependencies]
gpui-kit = { version = "0.10", features = ["syntect"] }
markdown = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# gpui-pre-macos 0.3.12 calls `Option::map_or_default`, which is still
# nightly-only on stable Rust. Vendored with the equivalent `map_or_else`.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
