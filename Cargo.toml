[workspace]
members = ["folio-core", "folio-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrsase/folio"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "1.0"
notify = "8"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# gpui-pre-macos 0.3.12 calls `Option::map_or_default`, still nightly-only on
# stable Rust. The vendored copy uses `map_or_else`. This patch is load-bearing:
# removing it breaks the build on stable. See THIRD_PARTY_NOTICES.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
